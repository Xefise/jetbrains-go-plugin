group = io.github.xefise.golsp
version = 0.1.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true

# The default 512m Kotlin daemon runs out of memory compiling main + test sources.
kotlin.daemon.jvmargs = -Xmx2g

# Machine-specific settings go into local.properties (git-ignored), e.g.:
#   webstormPath=/Applications/WebStorm.app
#   debuggerMcpPluginPath=/Applications/IntelliJ IDEA.app/Contents/plugins/debuggerMcp
#   mcpSandbox=true
#   mcpPort=64542
# Any of them can also be passed as -P<name>=<value>.
